name: AKSARA CI Validation
on:
  push:
    branches: ["main", "gh-pages"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f 404.html
          grep -q 'app.js?v=20261006' index.html
          grep -q 'styles.css?v=20261006' index.html
      - name: JavaScript syntax
        run: node --check app.js
      - name: Frontend reference check
        run: |
          grep -q 'nbewlpbbvtwtuvamadle.supabase.co' app.js
          grep -q 'supabase.min.js' index.html
          grep -q '2.117.2' index.html
      - name: Credential safety check
        run: |
          if grep -niE 'service[_-]?role|SUPABASE_SERVICE_ROLE|sb_secret_' app.js; then
            echo "Forbidden server credential reference detected in runtime source."
            exit 1
          fi
